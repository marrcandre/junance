{% extends "base.html" %}

{% block content %}
<main>
  <h1>Importar movimentações</h1>
  <p>Importe um arquivo para revisar antes de confirmar.</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="file" accept=".csv,.ofx,.xlsx" required>
    <button type="submit">Importar</button>
  </form>
</main>
{% endblock %}
