{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Junance{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="{% url 'core:dashboard' %}"><span class="brand-mark">J</span><span>junance</span></a>
      <p class="nav-label">VISÃO GERAL</p>
      <a class="nav-item {% if request.resolver_match.app_name == 'core' %}active{% endif %}" href="{% url 'core:dashboard' %}">⌂ <span>Painel inicial</span></a>
      <p class="nav-label">ORGANIZAÇÃO</p>
      <a class="nav-item {% if request.resolver_match.app_name == 'identity' %}active{% endif %}" href="{% url 'identity:family_list' %}">⌂ <span>Famílias</span></a>
      <a class="nav-item {% if request.resolver_match.app_name == 'ledger' and request.resolver_match.url_name == 'account_list' %}active{% endif %}" href="{% url 'ledger:account_list' %}">▣ <span>Contas</span></a>
      <a class="nav-item {% if request.resolver_match.app_name == 'ledger' %}active{% endif %}" href="{% url 'ledger:transaction_list' %}">↔ <span>Movimentações</span></a>
      <a class="nav-item {% if request.resolver_match.app_name == 'cards' %}active{% endif %}" href="{% url 'cards:card_list' %}">▤ <span>Cartões</span></a>
      <a class="nav-item {% if request.resolver_match.app_name == 'imports' %}active{% endif %}" href="{% url 'imports:upload' %}">⇩ <span>Importações</span></a>
      <a class="nav-item {% if request.resolver_match.app_name == 'planning' %}active{% endif %}" href="{% url 'planning:monthly' %}">◷ <span>Planejamento</span></a>
      <a class="nav-item {% if request.resolver_match.app_name == 'investments' %}active{% endif %}" href="{% url 'investments:position_list' %}">▥ <span>Investimentos</span></a>
      <div class="sidebar-footer">Junance · MVP em construção</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <span>Área de trabalho</span>
        <span class="environment"><span class="status-dot"></span> Protótipo</span>
      </header>
      <div class="page-content">{% block content %}{% endblock %}</div>
    </main>
  </div>
</body>
</html>
