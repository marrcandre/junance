services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: junance
      POSTGRES_USER: junance
      POSTGRES_PASSWORD: junance_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U junance -d junance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: junance_postgres_data
